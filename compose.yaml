services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql
  minio:
    image: stone-shelter-minio:RELEASE.2025-04-22T22-12-26Z
    build:
      context: ./infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
  stone-shelter-api:
    build:
      context: ./stone-shelter-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PHOTO_STORAGE_ENABLED: "true"
      PHOTO_CLEANUP_CRON: ${PHOTO_CLEANUP_CRON:-0 0 3 * * *}
      PHOTO_CLEANUP_ZONE: ${PHOTO_CLEANUP_ZONE:-UTC}
      PHOTO_CLEANUP_BATCH_SIZE: ${PHOTO_CLEANUP_BATCH_SIZE:-100}
      PHOTO_CLEANUP_MAX_OBJECTS: ${PHOTO_CLEANUP_MAX_OBJECTS:-1000}
      PHOTO_CLEANUP_INTERVAL_MS: ${PHOTO_CLEANUP_INTERVAL_MS:-1000}
      PHOTO_CLEANUP_MAX_DURATION: ${PHOTO_CLEANUP_MAX_DURATION:-PT30M}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BROWSER_ENDPOINT: ${MINIO_BROWSER_ENDPOINT:?Set MINIO_BROWSER_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
      MINIO_DRAFT_BUCKET: ${MINIO_DRAFT_BUCKET:?Set MINIO_DRAFT_BUCKET}
      STONE_PHOTO_PLACEHOLDER_URL: ${STONE_PHOTO_PLACEHOLDER_URL:?Set STONE_PHOTO_PLACEHOLDER_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
volumes:
  postgres-data:
  minio-data:
