openapi: 3.1.0
info:
  title: Stone Shelter API
  version: 1.0.0
  description: >-
    Browse Stones in Stone Shelter and maintain their names, geological types,
    sizes, biographies, admission times and adoption statuses.
security: []
tags:
  - name: Stones
paths:
  /api/v1/stones:
    get:
      tags: [Stones]
      operationId: listStones
      summary: Query the Stone Catalog
      description: >-
        Browse the catalog by geological type, size and adoption status. A Stone
        must match every selected filter. Results are divided into pages and
        can be ordered by name or size. The total includes all matching Stones,
        not just those on the current page. When nothing matches, the catalog
        page is empty. Unchanged catalog data keeps a consistent result order.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          description: Criteria for selecting and ordering a page of Stones.
          schema:
            $ref: '#/components/schemas/StoneCatalogQuery'
      responses:
        '200':
          description: Paginated matching Stones
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StonePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
    post:
      tags: [Stones]
      operationId: createStone
      summary: Create a Stone
      description: >-
        Register a Stone in the shelter with its attributes and admission time.
        Each Stone receives its own identity, even when other Stones share its
        name. Biography and photo information are optional.
      requestBody: {$ref: '#/components/requestBodies/StoneInput'}
      responses:
        '201':
          description: Stone created
          headers:
            Location:
              required: true
              description: Address where the newly registered Stone can be viewed.
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stone'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/stones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier of the Stone to view, edit or remove.
        schema: {type: integer, format: int64}
    get:
      tags: [Stones]
      operationId: getStone
      summary: Retrieve a Stone
      responses:
        '200':
          description: Requested Stone
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Stones]
      operationId: replaceStone
      summary: Fully replace a Stone's editable attributes
      description: >-
        Replace the attributes of an existing Stone while preserving its identity.
        Supply the complete updated information. Leaving out biography or photo
        clears that information. This operation edits a Stone already registered
        in the shelter rather than registering another one.
      requestBody: {$ref: '#/components/requestBodies/StoneInput'}
      responses:
        '200':
          description: Replaced Stone
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Stones]
      operationId: deleteStone
      summary: Permanently delete a Stone
      description: >-
        Permanently remove a Stone from the shelter catalog. It can no longer
        be viewed or found in catalog results. Registering a Stone with the same
        attributes later creates a separate Stone with a new identity.
      responses:
        '204':
          description: Stone permanently removed from the catalog
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  requestBodies:
    StoneInput:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StoneInput'}
          example:
            name: Basalt Buddy
            stoneType: BASALT
            stoneSize: SMALL
            adoptionStatus: AVAILABLE
            admissionDate: '2026-10-01T08:00:00Z'
            biography: A Stone admitted to the shelter.
            photo: null
  schemas:
    StoneCatalogQuery:
      type: object
      description: Criteria for choosing and ordering a page of Stones from the catalog.
      properties:
        page: {type: integer, minimum: 0, default: 0}
        size: {type: integer, minimum: 1, maximum: 24, default: 12}
        stoneType: {$ref: '#/components/schemas/StoneType'}
        stoneSize: {$ref: '#/components/schemas/StoneSize'}
        adoptionStatus: {$ref: '#/components/schemas/AdoptionStatus'}
        sortBy:
          type: string
          enum: [name, stoneSize]
          default: name
        sortDirection:
          type: string
          enum: [asc, desc]
          default: asc
    StoneType:
      type: string
      enum: [BASALT, GRANITE, OBSIDIAN, PUMICE, LIMESTONE, SANDSTONE, SHALE, MARBLE, GNEISS, SLATE]
    StoneSize:
      type: string
      enum: [SMALL, MEDIUM, LARGE]
    AdoptionStatus:
      type: string
      enum: [AVAILABLE, RESERVED, ADOPTED]
    StoneInput:
      type: object
      required: [name, stoneType, stoneSize, adoptionStatus, admissionDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
          description: The Stone's nonblank name. Multiple Stones may share the same name.
        stoneType: {$ref: '#/components/schemas/StoneType'}
        stoneSize: {$ref: '#/components/schemas/StoneSize'}
        adoptionStatus: {$ref: '#/components/schemas/AdoptionStatus'}
        admissionDate:
          type: string
          format: date-time
          description: >-
            The moment the Stone was admitted to the shelter, supplied by the
            person registering it. Admission must have already occurred or be
            occurring now; it cannot be scheduled for a future moment.
        biography:
          type: [string, 'null']
          maxLength: 2048
          description: Optional account of the Stone's history and life in the shelter.
        photo:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Optional photo information associated with the Stone. Leaving it
            out or supplying an empty value means the Stone has no photo information.
    Stone:
      allOf:
        - $ref: '#/components/schemas/StoneInput'
        - type: object
          required: [id, biography, photo]
          properties:
            id:
              type: integer
              format: int64
              description: Unique identity of the Stone throughout its time in the catalog.
            admissionDate:
              type: string
              format: date-time
              pattern: 'Z$'
              description: The moment the Stone was admitted to the shelter.
            photo:
              type: [string, 'null']
              minLength: 1
              description: Photo information, or no value when none has been supplied.
    StonePage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/Stone'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 24}
        totalElements: {type: integer, format: int64, minimum: 0}
    ProblemDetail:
      type: object
      description: Information explaining why a requested catalog action could not be completed.
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
  responses:
    BadRequest:
      description: The supplied catalog information needs correction before the action can be completed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request contains invalid input.
    NotFound:
      description: The requested Stone is not present in the shelter catalog.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: The requested Stone does not exist.
