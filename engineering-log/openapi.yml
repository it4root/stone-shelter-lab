openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/stones/{id}:
    get:
      tags:
      - stone-catalog-controller
      operationId: getStone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoneResponse"
    put:
      tags:
      - stone-catalog-controller
      operationId: updateStone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoneUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoneUpdateResponse"
    delete:
      tags:
      - stone-catalog-controller
      operationId: deleteStone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoneDeleteResponse"
  /api/v1/stones:
    post:
      tags:
      - stone-catalog-controller
      operationId: createStone
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoneCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StoneCreateResponse"
  /api/v1/stones/search:
    post:
      tags:
      - stone-catalog-controller
      operationId: searchStones
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StonesSearchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StonesSearchResponse"
components:
  schemas:
    StoneUpdateRequest:
      type: object
      description: Replacement details for an existing catalog entry.
      properties:
        name:
          type: string
          description: Stone name.
          maxLength: 120
          minLength: 0
        photo:
          type: string
          description: "Optional photo value, preserved as supplied."
          maxLength: 500
          minLength: 0
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        biography:
          type: string
          description: Optional stone biography.
          maxLength: 2048
          minLength: 0
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
        admissionDate:
          type: string
          format: date-time
          description: Admission timestamp; requests require a value in the past or
            present.
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
      required:
      - admissionDate
      - adoptionStatus
      - name
      - stoneSize
      - stoneType
    StoneUpdateResponse:
      type: object
      description: Updated stone catalog entry.
      properties:
        id:
          type: integer
          format: int64
          description: Unique stone identifier.
        name:
          type: string
          description: Stone name.
        photo:
          type: string
          description: "Optional photo value, preserved as supplied."
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        biography:
          type: string
          description: Optional stone biography.
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
        admissionDate:
          type: string
          format: date-time
          description: Stone admission timestamp.
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
    StoneCreateRequest:
      type: object
      description: Stone details for creating a catalog entry.
      properties:
        name:
          type: string
          description: Stone name.
          maxLength: 120
          minLength: 0
        photo:
          type: string
          description: "Optional photo value, preserved as supplied."
          maxLength: 500
          minLength: 0
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        biography:
          type: string
          description: Optional stone biography.
          maxLength: 2048
          minLength: 0
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
        admissionDate:
          type: string
          format: date-time
          description: Admission timestamp; requests require a value in the past or
            present.
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
      required:
      - admissionDate
      - adoptionStatus
      - name
      - stoneSize
      - stoneType
    StoneCreateResponse:
      type: object
      description: Created stone catalog entry.
      properties:
        id:
          type: integer
          format: int64
          description: Unique stone identifier.
        name:
          type: string
          description: Stone name.
        photo:
          type: string
          description: "Optional photo value, preserved as supplied."
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        biography:
          type: string
          description: Optional stone biography.
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
        admissionDate:
          type: string
          format: date-time
          description: Stone admission timestamp.
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
    SearchSort:
      type: object
      description: Optional ordering for a stone search.
      properties:
        field:
          type: string
          description: "Sort field: name or stoneSize; uses admissionDate when omitted."
          pattern: name|stoneSize
        direction:
          type: string
          description: "Sort direction: asc or desc; defaults to desc for admissionDate\
            \ and asc for name or stoneSize."
          pattern: asc|desc
    StoneSearchFilter:
      type: object
      description: Optional exact-match filters for a stone search.
      properties:
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
    StonesSearchRequest:
      type: object
      description: "Optional filters, pagination, and ordering for a stone search."
      properties:
        filter:
          $ref: "#/components/schemas/StoneSearchFilter"
          description: Optional exact-match filters; omitted filters do not restrict
            results.
        page:
          type: integer
          format: int32
          description: Zero-based page index; defaults to 0 when omitted.
          minimum: 0
        size:
          type: integer
          format: int32
          description: Page size from 1 to 24; defaults to 12 when omitted.
          maximum: 24
          minimum: 1
        sort:
          $ref: "#/components/schemas/SearchSort"
          description: "Optional ordering; defaults to admissionDate descending, with\
            \ id ascending to break ties."
    StoneSearchResponse:
      type: object
      description: Stone catalog entry returned in search results.
      properties:
        id:
          type: integer
          format: int64
          description: Unique stone identifier.
        name:
          type: string
          description: Stone name.
        photo:
          type: string
          description: "Optional photo value, preserved as supplied."
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        biography:
          type: string
          description: Optional stone biography.
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
        admissionDate:
          type: string
          format: date-time
          description: Stone admission timestamp.
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
    StonesSearchResponse:
      type: object
      description: A page of stone search results.
      properties:
        content:
          type: array
          description: Stone entries on the requested page.
          items:
            $ref: "#/components/schemas/StoneSearchResponse"
        page:
          type: integer
          format: int32
          description: Zero-based index of the returned page.
        size:
          type: integer
          format: int32
          description: Requested page size.
        totalElements:
          type: integer
          format: int64
          description: Total number of stones matching the filters.
    StoneResponse:
      type: object
      description: Stone catalog entry retrieved by its identifier.
      properties:
        id:
          type: integer
          format: int64
          description: Unique stone identifier.
        name:
          type: string
          description: Stone name.
        photo:
          type: string
          description: "Optional photo value, preserved as supplied."
        stoneType:
          type: string
          description: Stone type.
          enum:
          - BASALT
          - GRANITE
          - OBSIDIAN
          - PUMICE
          - LIMESTONE
          - SANDSTONE
          - SHALE
          - MARBLE
          - GNEISS
          - SLATE
        biography:
          type: string
          description: Optional stone biography.
        adoptionStatus:
          type: string
          description: Stone adoption status.
          enum:
          - AVAILABLE
          - RESERVED
          - ADOPTED
        admissionDate:
          type: string
          format: date-time
          description: Stone admission timestamp.
        stoneSize:
          type: string
          description: Stone size.
          enum:
          - SMALL
          - MEDIUM
          - LARGE
    StoneDeleteResponse:
      type: object
      description: Identifier of the deleted stone catalog entry.
      properties:
        id:
          type: integer
          format: int64
          description: Unique stone identifier.
